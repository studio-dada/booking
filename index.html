<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>예약 준비 중 · DADA STUDIO</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="DADA STUDIO 예약 페이지는 12월 1일에 오픈됩니다.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="DADA STUDIO 예약 페이지 준비 중">
    <meta property="og:description" content="12월 1일에 오픈됩니다.">
    <meta property="og:image" content="https://dada-studio.io/og-image.jpg">
    <link rel="icon" href="https://dada-studio.io/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <style>
        /* Colors and type follow the DADA STUDIO site (dada-studio.io). */
        :root {
            --paper: #f6f3ec;
            --ink: #141412;
            --ink-soft: #57554e;
            --line: rgba(20, 20, 18, .18);
            --ease: cubic-bezier(.16, 1, .3, 1);
            --sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui,
                "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
        }

        html,
        body {
            height: 100%;
        }

        body {
            display: grid;
            place-items: center;
            padding: 24px 16px;
            background: var(--paper);
            color: var(--ink);
            font-family: var(--sans);
            -webkit-font-smoothing: antialiased;
            word-break: keep-all;
        }

        main {
            width: 100%;
            max-width: 720px;
            text-align: center;
        }

        /* The name that changes: cafe1941, studio1941, dada-studio */
        .mark {
            position: relative;
            display: block;
            width: 100%;
            height: 1.2em;
            padding: 0;
            border: 0;
            background: none;
            color: inherit;
            font-family: inherit;
            font-size: clamp(40px, 11vw, 112px);
            font-weight: 650;
            line-height: 1.2;
            letter-spacing: -0.035em;
            cursor: pointer;
            appearance: none;
            -webkit-tap-highlight-color: transparent;
        }

        .seg {
            position: absolute;
            top: 0;
            left: 0;
            white-space: nowrap;
            opacity: 0;
            transition: transform .7s var(--ease), opacity .5s ease;
            will-change: transform, opacity;
        }

        .note {
            margin-top: 40px;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity .6s ease, transform .6s var(--ease);
        }

        .note.show {
            opacity: 1;
            transform: none;
        }

        .note h1 {
            font-size: clamp(20px, 4.4vw, 28px);
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .note p {
            margin-top: 8px;
            color: var(--ink-soft);
            font-size: clamp(15px, 3.6vw, 18px);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 28px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            min-height: 44px;
            padding: 0 20px;
            border: 1px solid var(--line);
            border-radius: 999px;
            color: var(--ink);
            font-size: 15px;
            font-weight: 500;
            text-decoration: none;
            transition: background .2s;
        }

        .btn:hover {
            background: rgba(20, 20, 18, .05);
        }

        .btn.primary {
            border-color: var(--ink);
            background: var(--ink);
            color: var(--paper);
        }

        .btn.primary:hover {
            background: #2b2b28;
        }

        .btn:focus-visible,
        .mark:focus-visible {
            outline: 2px solid var(--ink);
            outline-offset: 4px;
        }

        @media (prefers-reduced-motion: reduce) {

            .seg,
            .note {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <main>
        <button class="mark" id="mark" type="button"
            aria-label="cafe1941에서 studio1941, 그리고 dada-studio로. 누르면 다시 보기">
            <span class="seg" data-seg="cafe" aria-hidden="true">cafe</span>
            <span class="seg" data-seg="dada" aria-hidden="true">dada-</span>
            <span class="seg" data-seg="studio" aria-hidden="true">studio</span>
            <span class="seg" data-seg="year" aria-hidden="true">1941</span>
        </button>

        <section class="note" id="note">
            <h1>예약 페이지 준비 중입니다</h1>
            <p>12월 1일에 오픈됩니다.</p>
            <div class="actions">
                <a class="btn primary" href="https://dada-studio.io/">DADA STUDIO 둘러보기</a>
            </div>
        </section>
    </main>

    <script>
        (() => {
            // Each state lists the visible word pieces, left to right.
            const STATES = [["cafe", "year"], ["studio", "year"], ["dada", "studio"]];
            // When each state starts (ms after the font is ready), then when the note appears.
            const TIMES = [100, 1300, 2600];
            const NOTE_AT = 3800;

            const mark = document.getElementById("mark");
            const note = document.getElementById("note");
            const segs = {};
            mark.querySelectorAll(".seg").forEach((el) => { segs[el.dataset.seg] = el; });
            const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
            let current = -1;
            let timers = [];

            // Left edge (px) of each visible piece, with the whole name centred.
            function centred(state) {
                const names = STATES[state];
                const total = names.reduce((w, n) => w + segs[n].offsetWidth, 0);
                let x = (mark.clientWidth - total) / 2;
                const pos = {};
                for (const n of names) {
                    pos[n] = x;
                    x += segs[n].offsetWidth;
                }
                return pos;
            }

            // "1941" keeps one spot through cafe1941 and studio1941, so only the word in front of it
            // changes. The spot sits halfway between where each of those two names would be centred.
            function layout(state) {
                if (state === STATES.length - 1) return centred(state);
                const yearX = (centred(0).year + centred(1).year) / 2;
                const front = STATES[state][0];
                return { [front]: yearX - segs[front].offsetWidth, year: yearX };
            }

            // Leaving pieces fade fast and stay where they are. In the last change "studio" moves
            // only after "1941" has faded, and "dada-" comes in once "studio" has made room.
            const EXIT = "transform .5s var(--ease), opacity .2s linear";
            const MOVE = "transform .7s var(--ease), opacity .5s ease";
            const ENTER = "transform .7s var(--ease), opacity .45s ease .1s";
            const MOVE_LATE = "transform .7s var(--ease) .2s, opacity .5s ease";
            const ENTER_LATE = "transform .6s var(--ease) .55s, opacity .45s ease .6s";

            // transition "none" jumps straight to the new spot.
            function place(el, x, dy, opacity, transition) {
                el.style.transition = transition;
                el.style.transform = `translate(${x}px, ${dy}em)`;
                el.style.opacity = opacity;
                if (transition === "none") void el.offsetWidth; // apply the jump now
            }

            function show(state, animate) {
                const pos = layout(state);
                const prev = current >= 0 ? layout(current) : {};
                const late = state === STATES.length - 1;
                for (const [name, el] of Object.entries(segs)) {
                    if (name in pos) {
                        if (!animate) {
                            place(el, pos[name], 0, 1, "none");
                        } else if (name in prev) {
                            place(el, pos[name], 0, 1, late ? MOVE_LATE : MOVE);
                        } else {
                            // Entering: "dada-" slides in from the left, other pieces rise from below.
                            if (name === "dada") place(el, pos[name] - 24, 0, 0, "none");
                            else place(el, pos[name], 0.45, 0, "none");
                            place(el, pos[name], 0, 1, late ? ENTER_LATE : ENTER);
                        }
                    } else if (name in prev) {
                        // Leaving: "cafe" lifts away, "1941" drops away.
                        place(el, prev[name], name === "cafe" ? -0.45 : 0.45, 0, animate ? EXIT : "none");
                    }
                }
                current = state;
            }

            function play(withNote) {
                timers.forEach(clearTimeout);
                timers = [];
                for (const el of Object.values(segs)) place(el, 0, 0, 0, "none");
                current = -1;
                if (reduce) {
                    show(STATES.length - 1, false);
                    note.classList.add("show");
                    return;
                }
                TIMES.forEach((ms, state) => timers.push(setTimeout(() => show(state, true), ms)));
                if (withNote) timers.push(setTimeout(() => note.classList.add("show"), NOTE_AT));
            }

            mark.addEventListener("click", () => play(false));
            addEventListener("resize", () => { if (current >= 0) show(current, false); });

            const fontReady = document.fonts ? document.fonts.ready : Promise.resolve();
            Promise.race([fontReady, new Promise((r) => setTimeout(r, 1500))]).then(() => play(true));
            if (document.fonts) {
                document.fonts.addEventListener("loadingdone", () => { if (current >= 0) show(current, false); });
            }
        })();
    </script>
</body>

</html>
